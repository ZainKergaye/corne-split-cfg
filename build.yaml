---
include:
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view
    #snippet: studio-rpc-usb-uart
    #cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left
  # Dongle setup: both keyboard halves are BLE peripherals and the USB dongle
  # is the split central.
  - board: nice_nano_v2
    shield: eyelash_corne_left_dongle nice_view
    artifact-name: eyelash_corne_dongle_left
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view
    artifact-name: eyelash_corne_dongle_right
  - board: nice_nano_v2
    shield: eyelash_corne_dongle
    artifact-name: eyelash_corne_dongle
  # PandaKB's official Corne receiver build: USB/BLE split central, Eyelash
  # 1.3-inch OLED configuration, and the matching dongle status screen.
  - board: nice_nano_v2
    shield: Corne_dongle_central eyeslash_dongle_config dongle_display
    snippet: studio-rpc-usb-uart
    artifact-name: pandakb_corne_dongle_official
  - board: nice_nano_v2
    shield: settings_reset
